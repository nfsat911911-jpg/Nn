<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حديقة تحديات العلوم الإثرائية</title><style>body{margin:0;background:#f2f0fa;color:#35235a;font-family:Tahoma,Arial}main{max-width:760px;margin:24px auto;padding:26px;background:white;border-radius:25px}h1{text-align:center;color:#60399b}button{width:100%;text-align:right;background:#efe5ff;border:1px solid #9367c1;border-radius:13px;padding:15px;margin:7px 0;font-size:18px;color:#35235a}button:disabled{opacity:.8}#feedback{font-weight:bold;font-size:19px}a{color:#60399b}.good{background:#c7f2d5}.bad{background:#ffe1e1}</style><main><h1>🔬 حديقة تحديات العلوم الإثرائية</h1><p>الصف الخامس الابتدائي | إعداد الأستاذة / نجلاء البقمي</p><p>تحديات تحليل واستنتاج وحل مشكلات. اختاري الإجابة المدعومة بالدليل العلمي.</p><div id="v"></div></main><script>const games=[["مختبر التصنيف",["ظهرت عينة كائن لا يصنع غذاءه ويمتص المواد العضوية. ما التصنيف الأرجح؟","الفطريات","النباتات","الطيور"],["وجدت طالبة كائنًا وحيد الخلية بلا نواة حقيقية. ما الدليل الأهم على انتمائه للبكتيريا؟","غياب النواة المحاطة بغشاء","وجود أجنحة","امتلاك أوراق"],["أي معيارين أنسب لبناء مفتاح تصنيف للمخلوقات؟","طريقة التغذي وبنية الخلية","الحجم واللون فقط","مكان العثور عليها فقط"]],["مهندسة النبات",["نبات في بيئة جافة يحتاج تقليل فقد الماء. أي تصميم أنسب؟","أوراق صغيرة مغطاة بطبقة شمعية","أوراق واسعة رقيقة جدًا","جذور سطحية ضعيفة"],["إذا تلفت الجذور، فأي وظيفة تتأثر مباشرة؟","امتصاص الماء والأملاح","انتشار حبوب اللقاح","امتصاص الضوء بالأوراق"],["كيف تختبرين أثر الضوء على نمو نباتين؟","تثبيت بقية العوامل وتغيير كمية الضوء","تغيير الماء والضوء والتربة معًا","قياس اللون فقط دون مقارنة"]],["محقق التكاثر",["ما الميزة المحتملة للتكاثر الجنسي عند تغير الظروف البيئية؟","زيادة التنوع الوراثي","إنتاج أفراد متطابقين دائمًا","عدم الحاجة إلى أمشاج"],["انتقلت بذور نبات إلى منطقة بعيدة. ما النتيجة المتوقعة؟","انتشار النوع إلى موطن جديد مناسب","اختفاء دورة حياته فورًا","تحول البذور إلى فطريات"],["ما سبب صعوبة التكاثر في نبات زَهري عند اختفاء الملقحات؟","قد تقل عملية انتقال حبوب اللقاح","يتوقف امتصاص الماء مباشرة","تفقد الجذور وظيفتها"]],["محللة دورات الحياة",["وجدت حشرة تمر ببيض ويرقة وعذراء وبالغ. ما الاستنتاج؟","تمر بتحول كامل","تمر بتحول ناقص","تنمو دون تغير"],["إذا اختفت بيئة مناسبة لليرقات، ما النتيجة المرجحة؟","ينخفض عدد الأفراد البالغين لاحقًا","يزداد عدد البالغين دائمًا","تصبح جميع البيوض بالغة فورًا"],["أي مقارنة صحيحة بين دورة حياة نبات زهري وفراشة؟","كلاهما يمر بمراحل نمو وتكاثر مختلفة","كلاهما يبدأ بعذراء","كلاهما ينتج البيوض نفسها"]],["خبيرة الشبكات الغذائية",["إذا انخفضت أعداد الأرانب في شبكة غذائية، ما أثر محتمل في الثعالب المعتمدة عليها؟","قد يقل غذاؤها وتنخفض أعدادها","تزداد النباتات آليًا في كل الأحوال","تختفي الشمس"],["أي تغيير يؤثر مباشرة في معظم السلاسل الغذائية؟","تراجع المنتجات النباتية","زيادة الصخور","زيادة عدد الغيوم فقط"],["كيف تختبرين صحة توقع عن شبكة غذائية؟","تستخدمين بيانات عن أعداد الكائنات وعلاقات تغذيها","تعتمدين على التخمين فقط","تتجاهلين المنتجات"]],["مبتكرة التكيف",["مخلوق ينتقل لبيئة أبرد. أي صفة قد تعزز بقاءه؟","طبقة عازلة أكثر كثافة","فقدان جميع مصادر الغذاء","جلد رقيق جدًا دون عزل"],["لماذا تعد أقدام البط المكففة تكيفًا وظيفيًا؟","تساعد على السباحة","تصنع الغذاء","تنقل الأكسجين إلى الأوراق"],["كيف تحكمين على فاعلية تكيف ما؟","بمقارنة أثره على البقاء في ظروف البيئة","بلون الحيوان وحده","بحجم الحيوان فقط"]],["باحثة الدورات البيئية",["إذا تقلص الغطاء النباتي، ما التغير المحتمل في دورة الماء؟","تقل عملية النتح من النباتات","يتوقف الهطول عالميًا","يتحول الماء كله إلى جليد"],["أي عملية تعيد ثاني أكسيد الكربون للغلاف الجوي؟","التنفس والتحلل","البناء الضوئي فقط","امتصاص الجذور للماء"],["ما أفضل دليل على أثر التلوث في دورة الماء؟","مقارنة قياسات جودة الماء قبل التلوث وبعده","رسم الشمس فقط","تخمين بلا قياسات"]],["منقذة النظام البيئي",["تعرضت بحيرة للتلوث. ما أول خطوة علمية لصياغة حل؟","تحديد الملوثات ومصادرها","إضافة مخلفات جديدة","إزالة جميع الكائنات"],["لماذا قد يساعد التشجير في استعادة موطن متضرر؟","يوفر مأوى ويحد من انجراف التربة","يزيد التلوث بالضرورة","يوقف دورة الماء"],["كيف تقيسين نجاح خطة حماية نظام بيئي؟","مراقبة تحسن جودة الماء وتنوع الكائنات","عدد الملصقات فقط","لون الحاويات فقط"]],["مهندسة التضاريس",["منطقة بين مرتفعين تتجمع فيها المياه. أي معلم تصفين؟","وادٍ","هضبة","قمة"],["أي التضاريس أنسب غالبًا لتشييد طريق مستقيم قليل الانحدار؟","سهل واسع","جرف شديد الانحدار","قمة وعرة"],["كيف تبرهنين على دقة نموذج تضاريس؟","بمقارنته بخريطة وصور وقياسات","باختيار الألوان المفضلة فقط","بتجاهل الارتفاعات"]],["مختبر التعرية",["بعد هطول الأمطار انتقلت تربة من منحدر إلى أسفله. ما العملية؟","التعرية","التبخر","التلقيح"],["ما المتغير المناسب لاختبار أثر الغطاء النباتي في انجراف التربة؟","وجود النباتات مع تثبيت كمية الماء والانحدار","تغيير كل العوامل معًا","لون الوعاء فقط"],["أين يتوقع تراكم الرواسب عندما تقل سرعة جريان الماء؟","في مناطق الترسيب الهادئة","أعلى السحابة","داخل جذور النبات"]],["مستشارة الطاقة",["مدرسة في منطقة مشمسة تريد خفض استخدام الوقود. أي اقتراح أولي مناسب؟","ألواح شمسية مع حساب الاستهلاك","زيادة حرق الفحم","تعطيل الإنارة الطبيعية"],["ما العامل الذي يجب دراسته عند مقارنة الرياح بالشمس؟","توافر المصدر وتكلفته وأثره البيئي","لون الأجهزة","اسم المدينة وحده"],["كيف تثبتين جدوى ترشيد الكهرباء؟","مقارنة الاستهلاك قبل الإجراءات وبعدها","عد الأجهزة دون قياس","تخمين قيمة الفاتورة"]],["حارسة الهواء والماء",["ما الإجراء الأكثر مباشرة لتقليل هدر ماء المدرسة؟","إصلاح التسربات ومتابعة الاستهلاك","ترك الصنابير مفتوحة","زيادة غسل الساحات"],["كيف تختبرين أثر حملة ترشيد الماء؟","مقارنة عداد الاستهلاك قبل الحملة وبعدها","عدد الملصقات فقط","لون الخزانات"],["أي خطة تخفض تلوث الهواء قرب المدرسة؟","تشجيع المشي والنقل الجماعي الآمن حيث يناسب","حرق المخلفات","ترك المحركات تعمل بلا حاجة"]]];let g=0,n=0,score=0,locked=false;const v=document.getElementById('v');function home(){v.innerHTML='<h2>اختاري التحدي الإثرائي</h2>';games.forEach((x,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' | '+x[0];b.onclick=()=>location.hash='challenge-'+String(i+1).padStart(2,'0');v.append(b)})}function ask(){locked=false;const q=games[g][n+1];v.innerHTML='<h2>'+games[g][0]+'</h2><p>السؤال '+(n+1)+' من 3 | النقاط '+score+'</p><h3>'+q[0]+'</h3><div id="opts"></div><p id="feedback"></p><button id="next" style="display:none">التالي</button><p><a href="#">العودة للتحديات</a></p>';let choices=q.slice(1).map((a,i)=>({a,i}));for(let k=choices.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[choices[k],choices[j]]=[choices[j],choices[k]];}for(const o of choices){let b=document.createElement('button');b.textContent=o.a;b.onclick=()=>{if(locked)return;locked=true;let right=o.i===0;if(right)score++;b.className=right?'good':'bad';document.getElementById('feedback').textContent=right?'✅ استنتاج صحيح':'❌ راجعي الدليل العلمي. الإجابة: '+q[1];document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);let next=document.getElementById('next');next.style.display='block';next.onclick=()=>{n++;if(n<3)ask();else{v.innerHTML='<h2>نتيجة التحدي: '+score+' من 3</h2><p>'+(score===3?'تميز في التحليل والاستنتاج!':score===2?'إتقان جيد، راجعي السؤال المختلف.':'راجعي المفاهيم وحاولي ثانية.')+'</p><button id="retry">إعادة التحدي</button><a href="#">العودة للتحديات</a>';document.getElementById('retry').onclick=()=>start(g)}}};document.getElementById('opts').append(b)}}function start(i){g=i;n=0;score=0;ask()}function route(){let m=location.hash.match(/^#challenge-(\d{2})$/);m&&Number(m[1])>=1&&Number(m[1])<=12?start(Number(m[1])-1):home()}addEventListener('hashchange',route);route();</script></html>
