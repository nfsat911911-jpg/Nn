<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حديقة القيم الجميلة</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff9f8,#f2eaff 60%,#eaf8fa);font-family:system-ui,-apple-system,'Arial',sans-serif;color:#51386f;min-height:100vh}.wrap{max-width:860px;margin:auto;padding:18px 14px 40px}.hero{background:#ffffffd9;border:2px solid #e8d6ff;border-radius:28px;padding:25px 12px;text-align:center;box-shadow:0 8px 30px #b7a3d01c}.hero h1{margin:10px 0;color:#694397;font-size:clamp(25px,6vw,42px)}.hero p{line-height:1.8;margin:5px 0;font-size:clamp(13px,3.5vw,18px)}.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 18px;font-weight:700;font-size:clamp(12px,3vw,17px)}button{font:inherit;cursor:pointer}.reset{border:1px solid #bea5e5;background:white;color:#7955a3;border-radius:16px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:143px;border:2px solid #e0d7e7;border-radius:23px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;color:#4f376e;padding:10px 3px;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.97)}.tile .emoji{font-size:clamp(29px,6vw,42px)}.tile strong{font-size:clamp(16px,3.7vw,24px)}.tile small{font-size:clamp(11px,2.8vw,15px);color:#7e6d91}.tile.done{border-color:#6fba90}.tile:nth-child(4n+1){background:#e0f4ed}.tile:nth-child(4n+2){background:#fce3ed}.tile:nth-child(4n+3){background:#dfe9fc}.tile:nth-child(4n){background:#fff0cd}.panel{margin-top:20px;background:#fff;border:2px solid #dfc9f3;border-radius:22px;padding:20px;display:none;box-shadow:0 10px 30px #ab95ca22}.panel.visible{display:block}.panel h2{margin:0 0 14px;color:#70489e}.options{display:grid;gap:10px;margin:17px 0}.option{border:1px solid #d8c6ed;background:#faf6ff;border-radius:13px;padding:14px;text-align:right;color:#4c3768}.option.chosen{background:#e8d9ff;border:2px solid #9863c8}.primary{border:0;border-radius:14px;background:#7951ac;color:white;padding:13px 20px;width:100%;font-weight:700}.primary:disabled{opacity:.45}.feedback{padding:12px;border-radius:13px;background:#e7f6e9;margin:12px 0;display:none;line-height:1.7}.next{margin-top:10px;background:#f1e8fb;color:#694397}.footer{text-align:center;margin-top:28px;line-height:2;font-weight:700}.certificate{display:none;text-align:center;background:#fff7da;border:2px solid #e8cc7e;border-radius:20px;padding:18px;margin-top:20px}@media(max-width:360px){.wrap{padding:12px 8px}.grid{gap:7px}.tile{min-height:117px;border-radius:15px}.tile strong{font-size:14px}.tile small{font-size:10px}}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:30px">🌸 ✨ 🌈</div><h1>حديقة القيم الجميلة</h1><p>رحلة تفاعلية لتنمية القيم والسلوك الإيجابي</p><p>اختاري لعبة، وأجيبي، واجمعي النجوم!</p></header><section class="stats"><span id="stars">⭐ 0 نجمة</span><span id="progress">0 من 12 لعبة</span><button class="reset" id="reset">↻ إعادة اللعب</button></section><section class="grid" id="grid"><button class="tile" data-i="0"><span class="emoji">💎</span><strong>الصدق</strong><small>العبي الآن</small></button><button class="tile" data-i="1"><span class="emoji">🔐</span><strong>الأمانة</strong><small>العبي الآن</small></button><button class="tile" data-i="2"><span class="emoji">🌷</span><strong>الاحترام</strong><small>العبي الآن</small></button><button class="tile" data-i="3"><span class="emoji">🤝</span><strong>التعاون</strong><small>العبي الآن</small></button><button class="tile" data-i="4"><span class="emoji">💗</span><strong>الرحمة</strong><small>العبي الآن</small></button><button class="tile" data-i="5"><span class="emoji">🎒</span><strong>المسؤولية</strong><small>العبي الآن</small></button><button class="tile" data-i="6"><span class="emoji">📋</span><strong>النظام</strong><small>العبي الآن</small></button><button class="tile" data-i="7"><span class="emoji">🕊️</span><strong>التسامح</strong><small>العبي الآن</small></button><button class="tile" data-i="8"><span class="emoji">🎁</span><strong>العطاء</strong><small>العبي الآن</small></button><button class="tile" data-i="9"><span class="emoji">🌱</span><strong>الصبر</strong><small>العبي الآن</small></button><button class="tile" data-i="10"><span class="emoji">🇸🇦</span><strong>المواطنة</strong><small>العبي الآن</small></button><button class="tile" data-i="11"><span class="emoji">⭐</span><strong>الإحسان</strong><small>العبي الآن</small></button></section><section class="panel" id="panel" aria-live="polite"><h2 id="gameTitle"></h2><p id="question"></p><div class="options" id="options"></div><button class="primary" id="check" disabled>تحققي من الإجابة</button><div class="feedback" id="feedback"></div><button class="primary next" id="next" style="display:none">اللعبة التالية ←</button></section><section class="certificate" id="certificate"><h2>🏆 أنتِ سفيرة القيم!</h2><p>أكملتِ جميع تحديات القيم الجميلة بنجاح. أحسنتِ!</p></section><footer class="footer">إعداد الأستاذة/ نجلاء البقمي<br><span style="font-size:13px;font-weight:400">المرحلة الابتدائية</span></footer></main><script>const games=[['الصدق','وجدتِ قلمًا ليس لكِ في الفصل، ماذا تفعلين؟',['أحتفظ به','أسلّمه للمعلمة','أخفيه'],1,'الصدق والأمانة يحفظان حقوق الآخرين.'],['الأمانة','استعرتِ كتابًا من زميلتك، ماذا تفعلين؟',['أعيده بحالة جيدة','أتركه في الساحة','أكتب عليه'],0,'الأمانة تعني المحافظة على ممتلكات الآخرين.'],['الاحترام','عندما تتحدث زميلتك، ما السلوك الأفضل؟',['أقاطعها','أسخر منها','أستمع إليها باهتمام'],2,'الاستماع باهتمام من صور الاحترام.'],['التعاون','تحتاج زميلتك إلى المساعدة في ترتيب أدوات النشاط.',['أساعدها','أتجاهلها','أبعثر الأدوات'],0,'التعاون يجعل العمل أسهل وأكثر نجاحًا.'],['الرحمة','رأيتِ طالبة حزينة في الفسحة.',['أضحك عليها','أواسيها بلطف','أتجاهلها'],1,'الرحمة تظهر في لطفنا ومساندتنا للآخرين.'],['المسؤولية','انتهيتِ من استخدام أدواتك المدرسية.',['أتركها مبعثرة','أطلب من غيري جمعها','أعيدها إلى مكانها'],2,'تحمل المسؤولية يبدأ بالاهتمام بواجباتنا.'],['النظام','عند الدخول إلى الفصل، ماذا تفعلين؟',['ألتزم بالنظام','أتدافع مع زميلاتي','أرفع صوتي'],0,'النظام يحافظ على سلامتنا وراحتنا.'],['التسامح','اعتذرت زميلتك عن خطأ غير مقصود.',['أسيء إليها','أقبل اعتذارها','أنتقم منها'],1,'التسامح ينشر المحبة ويقوي الصداقة.'],['العطاء','تحتاج زميلتك إلى ورقة إضافية ولديك أوراق تكفيك.',['أرفض دون سبب','أمزق الورقة','أشاركها ورقة'],2,'العطاء مشاركة الخير مع الآخرين.'],['الصبر','واجهتِ سؤالًا صعبًا أثناء التعلم.',['أحاول من جديد','أستسلم فورًا','أترك المهمة'],0,'الصبر والمثابرة يساعداننا على النجاح.'],['المواطنة','كيف تُظهرين حبك لوطنك في المدرسة؟',['أهمل الممتلكات','أحافظ على مرافق المدرسة','أرمي النفايات'],1,'المحافظة على الممتلكات العامة من صور المواطنة الصالحة.'],['الإحسان','كيف تُحسنين إلى الآخرين؟',['أتجاهل احتياجاتهم','أسيء في الحديث','أساعدهم بكلمة وعمل طيب'],2,'الإحسان يكون بالقول الحسن والعمل النافع.']];let active=-1,choice=-1;let completed={};try{completed=JSON.parse(localStorage.getItem('values_completed')||'{}')||{}}catch(e){}const $=id=>document.getElementById(id);function update(){let n=Object.keys(completed).length;$('stars').textContent='⭐ '+n+' نجمة';$('progress').textContent=n+' من 12 لعبة';document.querySelectorAll('.tile').forEach((b,i)=>{let done=!!completed[i];b.classList.toggle('done',done);b.querySelector('small').textContent=done?'✓ تم الإنجاز':'العبي الآن'});$('certificate').style.display=n===12?'block':'none'}function openGame(i){active=i;choice=-1;let g=games[i];$('gameTitle').textContent='🌟 لعبة '+g[0];$('question').textContent=g[1];$('options').innerHTML='';g[2].forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{choice=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');$('check').disabled=false;$('feedback').style.display='none'};$('options').appendChild(b)});$('check').disabled=true;$('feedback').style.display='none';$('next').style.display='none';$('panel').classList.add('visible');$('panel').scrollIntoView({behavior:'smooth',block:'start'})}document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>openGame(+b.dataset.i)));$('check').onclick=()=>{if(choice<0)return;let g=games[active],correct=choice===g[3];$('feedback').textContent=correct?'🌟 أحسنتِ! '+g[4]:'💡 حاولي مرة أخرى، وفكّري في السلوك الصحيح.';$('feedback').style.display='block';$('feedback').style.background=correct?'#e7f6e9':'#fff1db';if(correct){completed[active]=true;try{localStorage.setItem('values_completed',JSON.stringify(completed))}catch(e){}update();$('next').style.display='block'}};$('next').onclick=()=>{if(Object.keys(completed).length===12){$('panel').classList.remove('visible');$('certificate').scrollIntoView({behavior:'smooth'})}else{let next=games.findIndex((g,i)=>!completed[i]);openGame(next)}};$('reset').onclick=()=>{if(!confirm('هل تريدين بدء الألعاب من جديد؟'))return;completed={};try{localStorage.removeItem('values_completed')}catch(e){}$('panel').classList.remove('visible');update()};update();</script></body></html>
