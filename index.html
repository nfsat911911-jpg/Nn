<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر الإتقان العلمي | علوم خامس</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#f0f7f8;color:#173d48;margin:0}header{background:#116b77;color:white;padding:25px;text-align:center}main{max-width:760px;margin:22px auto;padding:15px}.card{background:white;border:1px solid #c4dadd;border-radius:18px;padding:22px;box-shadow:0 4px 14px #14505b13}h1{font-size:1.6rem}h2{color:#075e68}button,a.option{display:block;width:100%;box-sizing:border-box;text-align:right;border:2px solid #bcd7dc;background:#fff;color:#143d47;border-radius:12px;padding:15px;margin:11px 0;font:inherit;cursor:pointer}button:hover{background:#e4f6f4}button.correct{background:#d9f4dd;border-color:#2a9447}button.wrong{background:#ffeded;border-color:#d44b4b}.feedback{font-weight:bold;min-height:32px}.muted{color:#5d737a}.footer{text-align:center;margin:30px}a{color:#066c7b}</style></head><body><header><h1>مختبر الإتقان العلمي</h1><p>ألعاب المعالجة التعليمية | العلوم – الصف الخامس الابتدائي | ١٤٤٨هـ</p></header><main><section class="card"><div id="game"></div></section><div class="footer">إعداد: أ. نجلاء البقمي</div></main><script>const games=[["تصنيف المخلوقات الحية","أي المجموعات تضم مخلوقات تصنع غذاءها غالبًا بنفسها؟",["النباتات","الفطريات","الحيوانات"],0],["الخلايا ووظائفها","ما الجزء الذي يتحكم في معظم أنشطة الخلية؟",["الجدار الخلوي","النواة","الفجوة"],1],["النباتات","أي جزء يمتص الماء والأملاح من التربة؟",["الجذور","الأزهار","الثمار"],0],["تكاثر النباتات","ما الذي يتكون بعد إخصاب البويضة في النباتات الزهرية؟",["البذرة","الجذر","الورقة"],0],["العلاقات في الأنظمة البيئية","ما العلاقة بين النحلة والزهرة عندما تحصل النحلة على الرحيق وتساعد في التلقيح؟",["تطفل","تبادل منفعة","افتراس"],1],["السلاسل الغذائية","ما مصدر الطاقة الأساسي لمعظم السلاسل الغذائية؟",["الشمس","التربة","الماء"],0],["التكيف والبقاء","لماذا تمتلك بعض النباتات الصحراوية أوراقًا صغيرة أو أشواكًا؟",["لتقليل فقد الماء","لزيادة النتح","لجذب المفترسات"],0],["تغيرات الأنظمة البيئية","ما أثر إزالة أعداد كبيرة من المنتجات من نظام بيئي؟",["قد يقل الغذاء للمستهلكات","يزداد الغذاء دائمًا","لا يحدث تغير"],0],["معالم سطح الأرض","أي العبارات تصف الوادي؟",["منطقة منخفضة بين مرتفعات","قمة جبل","سطح مستو مرتفع"],0],["التجوية والتعرية","ما العملية التي تنقل الفتات الصخري من مكان إلى آخر؟",["التعرية","التكثف","التبخر"],0],["الموارد الطبيعية","أي الموارد التالية متجدد في الظروف المناسبة؟",["ضوء الشمس","الفحم","النفط"],0],["المحافظة على الموارد","أي السلوكيات يساعد على المحافظة على الموارد الطبيعية؟",["إعادة التدوير","الإسراف في الماء","حرق النفايات"],0]];const root=document.getElementById('game');const p=new URLSearchParams(location.search);let n=Number(p.get('game'));function index(){root.innerHTML='<h2>اختاري التحدي العلمي</h2>'+games.map((g,i)=>'<button onclick="show('+i+')">'+(i+1)+' – '+g[0]+'</button>').join('')}function show(i){if(i<0||i>=games.length){index();return}n=i;history.replaceState(null,'','?game='+(i+1));const g=games[i];root.innerHTML='<p class="muted">اللعبة '+(i+1)+' من 12</p><h2>'+g[0]+'</h2><p>'+g[1]+'</p>'+g[2].map((o,j)=>'<button id="a'+j+'" onclick="answer('+j+')">'+o+'</button>').join('')+'<div class="feedback" id="feedback" aria-live="polite"></div><button onclick="show('+i+')">إعادة المحاولة</button><button onclick="location.href=location.pathname">جميع الألعاب</button>'}function answer(j){const g=games[n];g[2].forEach((_,k)=>{const b=document.getElementById('a'+k);b.disabled=true;if(k===g[3])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});document.getElementById('feedback').textContent=j===g[3]?'إجابة صحيحة! أحسنتِ.':'حاولي مجددًا بعد مراجعة الإجابة الصحيحة.'}if(n>=1&&n<=12)show(n-1);else index();</script></body></html>
