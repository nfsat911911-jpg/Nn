<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حديقة القيم الجميلة</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff9f8,#f2eaff 60%,#eaf8fa);font-family:system-ui,-apple-system,'Arial',sans-serif;color:#51386f;min-height:100vh}.wrap{max-width:860px;margin:auto;padding:18px 14px 40px}.hero{background:#ffffffd9;border:2px solid #e8d6ff;border-radius:28px;padding:25px 12px;text-align:center;box-shadow:0 8px 30px #b7a3d01c}.hero h1{margin:10px 0;color:#694397;font-size:clamp(25px,6vw,42px)}.hero p{line-height:1.8;margin:5px 0;font-size:clamp(13px,3.5vw,18px)}.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 18px;font-weight:700;font-size:clamp(12px,3vw,17px)}button{font:inherit;cursor:pointer}.reset{border:1px solid #bea5e5;background:white;color:#7955a3;border-radius:16px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:143px;border:2px solid #e0d7e7;border-radius:23px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;color:#4f376e;padding:10px 3px;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.97)}.tile .emoji{font-size:clamp(29px,6vw,42px)}.tile strong{font-size:clamp(16px,3.7vw,24px)}.tile small{font-size:clamp(11px,2.8vw,15px);color:#7e6d91}.tile.done{border-color:#6fba90}.tile:nth-child(4n+1){background:#e0f4ed}.tile:nth-child(4n+2){background:#fce3ed}.tile:nth-child(4n+3){background:#dfe9fc}.tile:nth-child(4n){background:#fff0cd}.panel{margin-top:20px;background:#fff;border:2px solid #dfc9f3;border-radius:22px;padding:20px;display:none;box-shadow:0 10px 30px #ab95ca22}.panel.visible{display:block}.panel h2{margin:0 0 14px;color:#70489e}.options{display:grid;gap:10px;margin:17px 0}.option{border:1px solid #d8c6ed;background:#faf6ff;border-radius:13px;padding:14px;text-align:right;color:#4c3768}.option.chosen{background:#e8d9ff;border:2px solid #9863c8}.primary{border:0;border-radius:14px;background:#7951ac;color:white;padding:13px 20px;width:100%;font-weight:700}.primary:disabled{opacity:.45}.feedback{padding:12px;border-radius:13px;background:#e7f6e9;margin:12px 0;display:none;line-height:1.7}.next{margin-top:10px;background:#f1e8fb;color:#694397}.footer{text-align:center;margin-top:28px;line-height:2;font-weight:700}.certificate{display:none;text-align:center;background:#fff7da;border:2px solid #e8cc7e;border-radius:20px;padding:18px;margin-top:20px}@media(max-width:360px){.wrap{padding:12px 8px}.grid{gap:7px}.tile{min-height:117px;border-radius:15px}.tile strong{font-size:14px}.tile small{font-size:10px}}body{background:linear-gradient(145deg,#f9f8ff,#ebe9fa 60%,#e4f2f4);color:#313854}.hero{border-color:#c9c6df;background:#ffffffea}.hero h1{color:#434c84}.tile:nth-child(4n+1){background:#e0eeee}.tile:nth-child(4n+2){background:#ede5f5}.tile:nth-child(4n+3){background:#e0e9f7}.tile:nth-child(4n){background:#f5eadf}.primary{background:#4a548b}.option.chosen{background:#e5e6f8;border-color:#53629c}.tile{color:#374067}.footer{color:#434c84}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:30px">✦ 💜 ✦</div><h1>حديقة القيم الجميلة</h1><p>مواقف واقعية وقرارات واعية لترسيخ القيم الإنسانية والوطنية</p><p>اختاري تحديًا، حلّلي الموقف، واكسبي نقاط التميز!</p></header><section class="stats"><span id="stars">⭐ 0 نقطة</span><span id="progress">0 من 12 تحديًا</span><button class="reset" id="reset">↻ إعادة اللعب</button></section><section class="grid" id="grid"><button class="tile" data-i="0"><span class="emoji">💎</span><strong>الصدق</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="1"><span class="emoji">🔐</span><strong>الأمانة</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="2"><span class="emoji">🌷</span><strong>الاحترام</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="3"><span class="emoji">🤝</span><strong>التعاون</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="4"><span class="emoji">💗</span><strong>الرحمة</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="5"><span class="emoji">🎒</span><strong>المسؤولية</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="6"><span class="emoji">📋</span><strong>النظام</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="7"><span class="emoji">🕊️</span><strong>التسامح</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="8"><span class="emoji">🎁</span><strong>العطاء</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="9"><span class="emoji">🌱</span><strong>الصبر</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="10"><span class="emoji">🇸🇦</span><strong>المواطنة</strong><small>ابدئي التحدي</small></button><button class="tile" data-i="11"><span class="emoji">⭐</span><strong>الإحسان</strong><small>ابدئي التحدي</small></button></section><section class="panel" id="panel" aria-live="polite"><h2 id="gameTitle"></h2><p id="question"></p><div class="options" id="options"></div><button class="primary" id="check" disabled>تحققي من الإجابة</button><div class="feedback" id="feedback"></div><button class="primary next" id="next" style="display:none">التحدي التالي ←</button></section><section class="certificate" id="certificate"><h2>🏆 أنتِ سفيرة القيم الراقية!</h2><p>أكملتِ جميع تحديات القيم الجميلة بنجاح. أحسنتِ!</p></section><footer class="footer">إعداد الأستاذة/ غزوى البقمي<br><span style="font-size:13px;font-weight:400">المرحلة الثانوية</span></footer></main><script>const games=[["الصدق","انتشر خبر غير موثق عن إحدى الطالبات في مجموعة الصف. ما التصرف الصحيح؟",["أعيد نشره للتأكد من ردود الفعل","أتوقف عن تداوله وأتحقق من مصدره","أضيف تفاصيل من عندي"],1,"الصدق والمسؤولية الرقمية يقتضيان التثبت وعدم نشر الشائعات."],["الأمانة","اطلعتِ على إجابات اختبار لم يُعقد بعد دون قصد. ما الموقف الأمين؟",["أبلّغ المعلمة دون تداول الإجابات","أرسلها لصديقاتي","أستفيد منها سرًا"],0,"الأمانة الأكاديمية تحافظ على عدالة التقييم ونزاهة التعلم."],["الاحترام","اختلفتِ مع زميلتك في نقاش علمي. كيف تعبّرين عن رأيك؟",["أصف رأيها بالسخيف","أقاطع حديثها","أعرض حجتي بأدب وأستمع إلى وجهة نظرها"],2,"الاختلاف الواعي يقوم على الحوار والأدلة والاحترام المتبادل."],["التعاون","تأخرت زميلة في إنجاز جزء من مشروع جماعي بسبب ظرف طارئ. ماذا تفعل المجموعة؟",["تعيد توزيع المهام باتفاق واضح","تستبعدها دون سؤال","تتوقف عن العمل تمامًا"],0,"التعاون الفعّال يجمع بين التعاطف وتوزيع الأدوار وتحمل المسؤولية."],["التعاطف","لاحظتِ انعزال زميلة وتراجع مشاركتها. ما الاستجابة الأنسب؟",["أنشر ملاحظتي للجميع","أتواصل معها بلطف وأشجعها على طلب المساندة المناسبة","أفترض أنها لا تريد أي دعم"],1,"التعاطف يبدأ بالإنصات ويحترم الخصوصية وحدود الآخرين."],["المسؤولية","اكتشفتِ خطأ في بيانات التقرير الذي أعددتِه قبل تسليمه. ماذا تفعلين؟",["أتجاهله لتوفير الوقت","ألقي اللوم على الفريق","أصححه وأوضح التعديل بشفافية"],2,"تحمل المسؤولية يعني مراجعة العمل وتصحيح الأخطاء بوضوح."],["الانضباط","لديكِ اختبار قريب ومهام متعددة. ما الخيار الأكثر فاعلية؟",["أنظم وقتي بخطة واقعية وألتزم بها","أؤجل جميع المهام حتى آخر ليلة","أذاكر دون فترات راحة"],0,"الانضباط الذاتي يحتاج إلى تخطيط متوازن ومتابعة مستمرة."],["التسامح","نشأ خلاف بينك وبين زميلة ثم اعتذرت عن إساءتها. ما التصرف الحكيم؟",["أرد بإساءة أشد","أقيّم الاعتذار بهدوء وأسعى لحل الخلاف مع حفظ الحدود","أنشر تفاصيل الخلاف"],1,"التسامح لا يلغي الحدود الشخصية، بل يدعم حل الخلاف باحترام."],["العطاء","تجيدين مهارة دراسية وتطلب زميلتك مساعدتك. ما أفضل تصرف؟",["أرسل لها الحل النهائي لتنسخه","أرفض مساعدتها دائمًا","أشرح لها الطريقة لتتمكن من الحل بنفسها"],2,"العطاء المعرفي الحقيقي يمكّن الآخرين من التعلم باستقلال."],["الصبر والمثابرة","لم تنجح تجربتك العلمية في المحاولة الأولى. كيف تتابعين؟",["أراجع الخطوات والمتغيرات وأعيد التجربة بأمان","أعدّ النتيجة فشلًا نهائيًا","أغيّر النتائج لتوافق الفرضية"],0,"المثابرة العلمية تقوم على المحاولة المنهجية وتوثيق النتائج بصدق."],["المواطنة","شاهدتِ محتوى يسيء إلى الممتلكات العامة ويشجع على تخريبها. ماذا تفعلين؟",["أشارك المحتوى للمزاح","أرفض السلوك وأساهم في التوعية بالمحافظة على الممتلكات","أشجّع الآخرين على تقليده"],1,"المواطنة المسؤولة تعزز المحافظة على الممتلكات العامة وخدمة المجتمع."],["الإحسان","أتيحت لك فرصة المشاركة في مبادرة لخدمة المجتمع. ما الموقف الأفضل؟",["أشارك فقط للحصول على الإعجاب","أعد بمهام لا أستطيع تنفيذها","أسهم بعمل نافع يناسب قدرتي وأؤديه بإتقان"],2,"الإحسان يجمع بين النية الطيبة والإتقان والأثر النافع."]];let active=-1,choice=-1;let completed={};try{completed=JSON.parse(localStorage.getItem('secondary_values_ghazwa')||'{}')||{}}catch(e){}const $=id=>document.getElementById(id);function update(){let n=Object.keys(completed).length;$('stars').textContent='⭐ '+n+' نقطة';$('progress').textContent=n+' من 12 تحديًا';document.querySelectorAll('.tile').forEach((b,i)=>{let done=!!completed[i];b.classList.toggle('done',done);b.querySelector('small').textContent=done?'✓ تم الإنجاز':'ابدئي التحدي'});$('certificate').style.display=n===12?'block':'none'}function openGame(i){active=i;choice=-1;let g=games[i];$('gameTitle').textContent='🌟 تحدي '+g[0];$('question').textContent=g[1];$('options').innerHTML='';g[2].forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{choice=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');$('check').disabled=false;$('feedback').style.display='none'};$('options').appendChild(b)});$('check').disabled=true;$('feedback').style.display='none';$('next').style.display='none';$('panel').classList.add('visible');$('panel').scrollIntoView({behavior:'smooth',block:'start'})}document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>openGame(+b.dataset.i)));$('check').onclick=()=>{if(choice<0)return;let g=games[active],correct=choice===g[3];$('feedback').textContent=correct?'🌟 أحسنتِ! '+g[4]:'💡 حاولي مرة أخرى، وفكّري في السلوك الصحيح.';$('feedback').style.display='block';$('feedback').style.background=correct?'#e7f6e9':'#fff1db';if(correct){completed[active]=true;try{localStorage.setItem('secondary_values_ghazwa',JSON.stringify(completed))}catch(e){}update();$('next').style.display='block'}};$('next').onclick=()=>{if(Object.keys(completed).length===12){$('panel').classList.remove('visible');$('certificate').scrollIntoView({behavior:'smooth'})}else{let next=games.findIndex((g,i)=>!completed[i]);openGame(next)}};$('reset').onclick=()=>{if(!confirm('هل تريدين بدء الألعاب من جديد؟'))return;completed={};try{localStorage.removeItem('secondary_values_ghazwa')}catch(e){}$('panel').classList.remove('visible');update()};update();</script></body></html>
