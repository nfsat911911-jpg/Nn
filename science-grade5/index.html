<!doctype html><html lang="ar" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حديقة العلوم العلاجية</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#e9f5ed;color:#145337;margin:0;padding:20px}main{background:white;max-width:800px;padding:25px;border-radius:20px;margin:auto}h1{text-align:center}button{cursor:pointer;display:block;width:100%;font-size:18px;text-align:right;margin:8px 0;padding:13px;background:#e0efe4;border:1px solid #29734c;border-radius:12px;color:#134b32}.good{background:#b9ecc6}.bad{background:#ffe5e5}#feedback{font-size:19px;font-weight:bold}a{color:#145337}#back{margin-top:18px;display:block}</style><main><h1>🌿 حديقة ألعاب العلوم العلاجية</h1><p>الصف الخامس الابتدائي | إعداد الأستاذة / نجلاء البقمي</p><div id="view"></div></main><script>const games=[["تصنيف المخلوقات الحية",[["أي المخلوقات التالية ينتمي إلى الفطريات؟","عيش الغراب","الطحلب","النملة"],["أي المخلوقات يصنع غذاءه بعملية البناء الضوئي؟","النبات الأخضر","الأسد","الفطر"],["ما المجموعة التي تضم كائنات دقيقة قد تكون وحيدة الخلية؟","البكتيريا","الثدييات","الطيور"]]],["النباتات",[["أي النباتات ينتج بذورًا داخل الثمار؟","النباتات الزهرية","الحزازيات","السرخسيات"],["أي النباتات يتكاثر بالأبواغ؟","السرخس","التفاح","النخيل"],["ما وظيفة الجذور غالبًا؟","امتصاص الماء وتثبيت النبات","صنع البذور","إنتاج الثمار"]]],["التكاثر",[["لماذا تتكاثر المخلوقات الحية؟","لاستمرار النوع","لإيقاف النمو","لتغيير المناخ"],["أي نوع من التكاثر يحتاج عادةً إلى أبوين؟","التكاثر الجنسي","الانقسام الثنائي","التبرعم"],["ما وظيفة البذور في النباتات البذرية؟","إنتاج نباتات جديدة","امتصاص الضوء","تخزين الهواء"]]],["دورات الحياة",[["بم تبدأ دورة حياة الفراشة؟","البيضة","العذراء","الفراشة البالغة"],["ما المرحلة التي تسبق الفراشة البالغة؟","العذراء","البيضة","اليرقة"],["ما معنى دورة الحياة؟","مراحل نمو الكائن وتكاثره","نوع غذائه فقط","مكان وجوده"]]],["العلاقات في الأنظمة البيئية",[["ما اسم العلاقة التي يستفيد فيها مخلوق ويتضرر الآخر؟","التطفل","التقايض","التكافل"],["من يعد منتجًا في سلسلة غذائية؟","العشب","الأرنب","الثعلب"],["ماذا تسمى علاقة افتراس الأسد للحمار الوحشي؟","افتراس","تنافس","تطفل"]]],["التكيف والبقاء",[["كيف تساعد أشواك الصبار النبات؟","تقلل فقد الماء وتوفر حماية","تزيد فقد الماء","تمنع البناء الضوئي"],["ما تكيف الجمل الملائم للصحراء؟","تحمل نقص الماء","الخياشيم","الأجنحة"],["لماذا يتغير لون فراء بعض الحيوانات؟","للتخفي في بيئتها","لتغيير غذائها","لإنتاج الأكسجين"]]],["الدورات في الأنظمة البيئية",[["ما الذي يحول الماء السائل إلى بخار؟","التبخر","الهطول","التجمد"],["كيف تتشكل السحب؟","بتكاثف بخار الماء","بتحجر الصخور","بذوبان التربة"],["ما المقصود بالهطول؟","سقوط الماء من الغلاف الجوي","صعود بخار الماء","انتقال الرمال"]]],["التغيرات في الأنظمة البيئية",[["ماذا قد يحدث عند الجفاف الطويل؟","تقل المياه المتاحة للمخلوقات","تزداد الأمطار دائمًا","تختفي الحاجة للماء"],["ما أحد آثار قطع الأشجار؟","فقد موائل بعض الكائنات","زيادة الموائل دائمًا","توقف الرياح"],["كيف يمكن تقليل أثر التلوث؟","الحد من النفايات وإعادة التدوير","إلقاء النفايات في الأنهار","حرق المخلفات عشوائيًا"]]],["معالم سطح الأرض",[["ما المعلم المرتفع ذو القمة؟","الجبل","السهل","الوادي"],["ما المنطقة المنخفضة بين مرتفعات؟","الوادي","الهضبة","القمة"],["ما المنطقة الواسعة المستوية نسبيًا؟","السهل","الجبل","التل"]]],["العمليات المؤثرة في سطح الأرض",[["ما تفتت الصخور إلى أجزاء أصغر؟","التجوية","الترسيب","التكاثف"],["ما نقل الفتات الصخري من مكان لآخر؟","التعرية","التجمد","الانصهار"],["ما استقرار الفتات الصخري في موقع جديد؟","الترسيب","التجوية","التبخر"]]],["مصادر الطاقة",[["أي المصادر يعد متجددًا؟","ضوء الشمس","الفحم","النفط"],["أي المصادر غير متجدد؟","الغاز الطبيعي","الرياح","أشعة الشمس"],["لماذا نرشد استهلاك الطاقة؟","لحفظ الموارد وتقليل الأثر البيئي","لزيادة الهدر","لإيقاف التقنيات"]]],["الهواء والماء",[["ما سلوك يحافظ على الماء؟","إغلاق الصنبور عند عدم الحاجة","ترك التسرب","غسل الرصيف بالماء بكثرة"],["أي النشاطات يزيد تلوث الهواء؟","حرق النفايات","زراعة الأشجار","المشي"],["كيف نحافظ على مياه الأنهار؟","عدم إلقاء الملوثات فيها","صب الزيوت فيها","رمي المخلفات"]]]];let index=0,score=0,locked=false,game=0;const v=document.getElementById("view");function home(){v.innerHTML="<h2>اختاري اللعبة</h2>";games.forEach((g,k)=>{let b=document.createElement("button");b.textContent=(k+1)+" | "+g[0];b.onclick=()=>{location.hash="game-"+String(k+1).padStart(2,"0")};v.append(b)})}function question(){locked=false;let q=games[game][1][index];v.innerHTML="<h2>"+games[game][0]+"</h2><p>السؤال "+(index+1)+" من 3 | النقاط: "+score+"</p><h3>"+q[0]+"</h3><div id='choices'></div><p id='feedback' aria-live='polite'></p><button id='next' style='display:none'>السؤال التالي</button><a id='back' href='#'>العودة إلى جميع الألعاب</a>";let opts=q.slice(1).map((a,k)=>({a,k}));for(let j=opts.length-1;j>0;j--){let z=Math.floor(Math.random()*(j+1));[opts[j],opts[z]]=[opts[z],opts[j]]}opts.forEach(o=>{let b=document.createElement("button");b.textContent=o.a;b.onclick=()=>{if(locked)return;locked=true;let ok=o.k===0;if(ok)score++;document.getElementById("feedback").textContent=ok?"✅ إجابة صحيحة":"❌ الإجابة الصحيحة: "+q[1];b.className=ok?"good":"bad";document.getElementById("next").style.display="block";document.getElementById("next").onclick=()=>{index++;if(index<3)question();else{v.innerHTML="<h2>نتيجتك: "+score+" من 3</h2><p>"+(score>=2?"تحقّق مؤشر الإتقان، أحسنتِ!":"راجعي المفاهيم ثم أعيدي اللعبة.")+"</p><button id='retry'>إعادة اللعبة</button><a id='back' href='#'>العودة إلى جميع الألعاب</a>";document.getElementById("retry").onclick=()=>start(game)}};v.querySelectorAll("#choices button").forEach(x=>x.disabled=true)};document.getElementById("choices").append(b)})}function start(n){game=n;index=0;score=0;question()}function route(){let m=location.hash.match(/^#game-(\d{2})$/);if(m&&+m[1]>=1&&+m[1]<=games.length)start(+m[1]-1);else home()}addEventListener("hashchange",route);route();</script></html>
