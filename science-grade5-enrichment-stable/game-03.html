<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>محققة التكاثر | العلوم الإثرائية</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f1edf9;color:#392160;margin:0;padding:18px}main{max-width:760px;margin:18px auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 4px 18px #0001}h1{font-size:26px;color:#673da0}h2{font-size:23px;line-height:1.8}.choice,button.next{display:block;width:100%;font-family:inherit;font-size:19px;text-align:right;line-height:1.7;padding:12px;margin:11px 0;border-radius:12px;border:2px solid #8564b4;background:#efe7fb;color:#36205b;cursor:pointer}.choice.correct{background:#cdf2da;border-color:#188448}.choice.wrong{background:#ffe1e1;border-color:#ba3939}button:disabled{opacity:.9}#next{display:none;background:#673da0;color:white;text-align:center}#feedback{font-size:19px;font-weight:bold;min-height:1.5em}a{color:#673da0}small{color:#62577a}</style></head><body><main><h1>🔬 محققة التكاثر</h1><p>حديقة تحديات العلوم الإثرائية | الصف الخامس الابتدائي</p><p>إعداد الأستاذة / نجلاء البقمي</p><small id="progress">السؤال 1 من 3 | النقاط 0</small><h2 id="question">لماذا يفيد التنوع الوراثي في البيئات المتغيرة؟</h2><div id="choices"><button class="choice" type="button">قد يساعد بعض الأفراد على التكيف</button><button class="choice" type="button">يمنع جميع التغيرات</button><button class="choice" type="button">يجعل الأفراد متطابقين دائمًا</button></div><p id="feedback" aria-live="polite"></p><button id="next" type="button" class="next">السؤال التالي</button><p><a href="index.html">العودة إلى جميع التحديات</a></p></main><script>const questions=[["لماذا يفيد التنوع الوراثي في البيئات المتغيرة؟","قد يساعد بعض الأفراد على التكيف","يمنع جميع التغيرات","يجعل الأفراد متطابقين دائمًا"],["ما المتوقع إذا قل عدد الملقحات حول النباتات الزهرية؟","قد ينخفض تكوّن البذور","تختفي جذور النباتات","تزداد البذور دائمًا"],["أي ميزة للتكاثر اللاجنسي؟","إنتاج أفراد دون الحاجة إلى شريك","إنتاج أفراد بأبوين دائمًا","انعدام انتقال الصفات"]];let index=0,score=0,answered=false;const choices=document.getElementById("choices"),next=document.getElementById("next"),feedback=document.getElementById("feedback");function show(){answered=false;const q=questions[index];document.getElementById("progress").textContent="السؤال "+(index+1)+" من 3 | النقاط "+score;document.getElementById("question").textContent=q[0];feedback.textContent="";next.style.display="none";choices.innerHTML="";for(let j=1;j<=3;j++){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=q[j];b.onclick=function(){if(answered)return;answered=true;const ok=j===1;if(ok)score++;this.classList.add(ok?"correct":"wrong");feedback.textContent=ok?"✅ إجابة صحيحة، أحسنتِ!":"❌ راجعي التفسير. الإجابة الصحيحة: "+q[1];Array.from(choices.children).forEach(x=>x.disabled=true);next.style.display="block";next.textContent=index===2?"عرض النتيجة":"السؤال التالي";};choices.appendChild(b)}}next.onclick=function(){if(index<2){index++;show()}else{document.getElementById("question").textContent="انتهى التحدي | نتيجتك: "+score+" من 3";choices.innerHTML="";feedback.textContent=score===3?"تميّز في التفكير العلمي!": "راجعي المفاهيم ثم أعيدي التحدي.";next.textContent="إعادة التحدي";next.style.display="block";next.onclick=function(){index=0;score=0;next.onclick=advance;show()}}};const advance=next.onclick;show();</script></body></html>
